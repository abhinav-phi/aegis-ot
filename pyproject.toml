[project]
name = "aegis-ot"
version = "1.0.0"
description = "AEGIS-OT: Cyber-Physical Anomaly Attribution and Validator-Gated Mitigation Intelligence for SCADA/ICS (research-grade, sandbox-only)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1; platform_system != 'Windows' or python_version >= '3.11'",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "pyyaml>=6.0",
  "email-validator>=2.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
ml = ["torch>=2.3", "pyarrow>=16"]
stores = ["minio>=7.2", "chromadb>=0.5"]
dev = [
  "pytest>=8.2", "pytest-asyncio>=0.23", "mypy>=1.10", "ruff>=0.4",
  "httpx>=0.27", "coverage>=7.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# B008 = function calls in argument defaults — the idiomatic FastAPI
# dependency-injection pattern (Depends/File) used across the API layer.
"app/api/**" = ["B008"]
"app/core/**" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "pipeline*", "eval*"]
